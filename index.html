<!DOCTYPE html>
<html lang="en">
  <head>
    <title>maroku.sh</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=1" name="viewport" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@4.8.1/css/xterm.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.css" />
    <link rel="shortcut icon" type="image/png" href="https://github.githubassets.com/images/icons/emoji/unicode/1f300.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@4.8.1/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.4.0/lib/xterm-addon-fit.js"></script>
    <style type="text/css">
     <!-- 
        html, body {
            background-color: black;
            height: 100%;
        }
        #terminal {
            height: 100%;
            overflow: hidden
        }
        .xterm-viewport {
            overflow: hidden !important;
        }
       -->
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <script>
        const term = new Terminal({ screenKeys: false });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        fitAddon.fit();
        window.term = term;
        term.focus();
        
        // Command history
        let commandHistory = [];
        let historyIndex = -1;
        
        // Current input line
        let currentInput = '';

        // Tab completion state
        let completionMatches = [];
        let completionShown = false;

        // Built-in commands
        const builtins = ['clear', 'help', 'exit'];

        // Command and app registry — loaded from manifest.json
        let registry = [];
        
        // Add event listener for keyboard input
        term.onData((data) => {
            switch (data) {
                case '\t': // Tab key
                    handleTab();
                    break;
                case '\r': // Enter key
                    if (currentInput.trim() !== '') {
                        commandHistory.push(currentInput);
                        historyIndex = commandHistory.length;
                        term.write('\n');
                        executeCommand(currentInput.trim());
                    } else {
                        term.write('\r\n$ ');
                    }
                    currentInput = '';
                    completionMatches = [];
                    completionShown = false;
                    break;
                case '\u007F': // Backspace key
                    if (currentInput.length > 0) {
                        currentInput = currentInput.slice(0, -1);
                        if (completionShown) {
                            completionShown = false;
                            completionMatches = [];
                        }
                        term.write('\b \b');
                    }
                    break;
                default:
                    // Printable characters
                    if (data >= ' ' && data <= '~') {
                        if (completionShown) {
                            // User typed more — hide the matches list, keep the cursor position
                            // Move to end of matches line, clear it
                            const matchLineLen = completionMatches.reduce((sum, m) => sum + m.length + 2, 0);
                            term.write('\r' + ' '.repeat(matchLineLen + 4) + '\r\n');
                            // Redraw prompt + input
                            term.write('\r$ ' + currentInput);
                            completionShown = false;
                        }
                        currentInput += data;
                        term.write(data);
                    }
                    break;
            }
        });
        
        // Handle arrow keys for command history and Ctrl+D
        term.onKey((key) => {
            if (key.key === '\u001B[A') { // Up arrow
                if (commandHistory.length > 0) {
                    if (historyIndex === commandHistory.length) {
                        // Save current input
                        commandHistory.push(currentInput);
                    }
                    historyIndex = Math.max(0, historyIndex - 1);
                    const prevCommand = commandHistory[historyIndex];
                    // Clear current line
                    term.write('\r$ ' + ' '.repeat(currentInput.length));
                    // Move cursor back to start of input
                    term.write('\r$ ');
                    currentInput = prevCommand;
                    term.write(prevCommand);
                }
            } else if (key.key === '\u001B[B') { // Down arrow
                if (commandHistory.length > 0) {
                    historyIndex = Math.min(commandHistory.length, historyIndex + 1);
                    const nextCommand = commandHistory[historyIndex] || '';
                    // Clear current line
                    term.write('\r$ ' + ' '.repeat(currentInput.length));
                    // Move cursor back to start of input
                    term.write('\r$ ');
                    currentInput = nextCommand;
                    term.write(nextCommand);
                }
            } else if (key.key === 'd' && key.ctrlKey) { // Ctrl+D
                exit();
            }
        });
        
function getAvailableCommands() {
    const cmds = [...builtins];
    for (const entry of registry) {
        cmds.push(entry.name);
    }
    return cmds;
}

function handleTab() {
    if (completionShown) {
        // Re-show matches
        showMatches();
        return;
    }

    const prefix = currentInput;
    if (prefix.length === 0) return;

    const allCommands = getAvailableCommands();
    const matches = allCommands.filter(c => c.startsWith(prefix));

    if (matches.length === 0) {
        // No matches — bell
        term.write('\x07');
        return;
    }

    if (matches.length === 1) {
        // Single match — complete
        currentInput = matches[0];
        term.write(matches[0].slice(prefix.length));
        return;
    }

    // Multiple matches — show list
    completionMatches = matches;
    showMatches();
}

function showMatches() {
    // Save cursor position by moving to column 0 of current line
    term.write('\r\n');
    for (const match of completionMatches) {
        term.write(match + '  ');
    }
    term.write('\r\n$ ' + currentInput);
    completionShown = true;
}

async function loadRegistry() {
    try {
        const response = await fetch('./commands/manifest.json');
        registry = await response.json();
    } catch (err) {
        console.error('Failed to load command registry:', err);
        registry = [];
    }
}

async function executeCommand(command) {
    const parts = command.split(' ');
    let cmd = parts[0].toLowerCase();
    // Strip ./ prefix so ./tetris maps to tetris
    cmd = cmd.replace(/^\.\//, '');
    const args = parts.slice(1);

    if (cmd === '') {
        term.write('\r$ ');
        return;
    }

    // Handle built-in commands that don't need external files
    if (cmd === 'clear') {
        clear();
        return;
    }
    if (cmd === 'exit') {
        exit();
        return;
    }
    if (cmd === 'help') {
        await help(); // Help will now be async to fetch command list
        return;
    }

    // Check if this is a registered command or app
    const entry = registry.find(r => r.name === cmd);
    if (!entry) {
        term.write(`\r\nCommand not found: ${cmd}\r\n\r$ `);
        return;
    }

    // Terminal commands (type: "command")
    if (entry.type === 'command') {
        try {
            const module = await import(`./commands/${cmd}.js`);
            if (module && typeof module.execute === 'function') {
                await module.execute(args);
            } else {
                throw new Error('Invalid command module');
            }
        } catch (err) {
            console.error("Error executing command:", err);
            term.write(`\r\nCommand error: ${cmd} (${err.message})\r\n\r$ `);
        }
        return;
    }

    // Apps (type: "app")
    if (entry.type === 'app') {
        try {
            const module = await import(`./commands/${cmd}.js`);
            if (module && typeof module.execute === 'function') {
                await launchApp(cmd, module, args);
            } else {
                throw new Error('Invalid app module');
            }
        } catch (err) {
            console.error("Error launching app:", err);
            term.write(`\r\nFailed to launch ${cmd} (${err.message})\r\n\r$ `);
        }
        return;
    }
}
        
let appContainer = null;
let escapeKeyHandler = null;

async function launchApp(name, module, args) {
    // Hide terminal
    term.write('\r\n');
    document.getElementById('terminal').style.display = 'none';
    
    // Create app container
    appContainer = document.createElement('div');
    appContainer.id = 'app-container';
    appContainer.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:black;z-index:1000;';
    
    // Add close button
    const closeBtn = document.createElement('button');
    closeBtn.id = 'app-close';
    closeBtn.innerHTML = '&#10005;';
    closeBtn.style.cssText = 'position:absolute;top:10px;right:10px;background:rgba(255,0,0,0.7);color:white;border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;z-index:1001;';
    closeBtn.title = 'Exit app (Esc)';
    closeBtn.addEventListener('click', () => {
        if (module.onExit) module.onExit();
        restoreTerminal();
    });
    
    appContainer.appendChild(closeBtn);
    document.body.appendChild(appContainer);
    
    // Escape key to exit
    escapeKeyHandler = (e) => {
        if (e.key === 'Escape') {
            if (module.onExit) module.onExit();
            restoreTerminal();
        }
    };
    window.addEventListener('keydown', escapeKeyHandler);
    
    // Launch app
    await module.execute(args, appContainer, () => {
        if (module.onExit) module.onExit();
        restoreTerminal();
    });
}

function restoreTerminal() {
    if (appContainer) {
        appContainer.remove();
        appContainer = null;
    }
    if (escapeKeyHandler) {
        window.removeEventListener('keydown', escapeKeyHandler);
        escapeKeyHandler = null;
    }
    document.getElementById('terminal').style.display = '';
    term.write('\r$ ');
    term.focus();
}

async function help() {
    term.write('\r\nAvailable commands:\r\n');
    
    for (const entry of registry) {
        const desc = entry.desc || "No description available";
        term.write(`  ${entry.name.padEnd(17)} - ${desc}\r\n`);
    }
    
    term.write('  clear             - Clear the terminal screen\r\n');
    term.write('  help              - Show this help message\r\n');
    term.write('  exit              - Close this tab/window\r\n');
    term.write('\r$ ');
}
        
function exit() {
    window.close();
}
        
function clear() {
    term.clear();
    term.write('\r$ ');
}
        
// Show banner on load
const now = new Date();
const pacificTime = now.toLocaleTimeString('en-US', { timeZone: 'America/Los_Angeles' });
term.write('\r\n');
term.write('  Welcome to maroku.sh - Pacific Time: ' + pacificTime + '\r\n\r\n');
term.write('  Type help to see available commands.\r\n\r\n$ ');

// Load command registry on startup
loadRegistry();
    </script>
  </body>
</html>
