<!DOCTYPE html>
<html>
  <head>
    <title>maroku.sh</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=1" name="viewport" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@4.8.1/css/xterm.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.css" />
    <link rel="shortcut icon" type="image/png" href="https://github.githubassets.com/images/icons/emoji/unicode/1f300.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@4.8.1/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.4.0/lib/xterm-addon-fit.js"></script>
    <style type="text/css">
     <!-- 
        html, body {
            background-color: black;
            height: 100%;
        }
        #terminal {
            height: 100%;
            overflow: hidden
        }
        .xterm-viewport {
            overflow: hidden !important;
        }
       -->
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <script>
        const term = new Terminal();
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        fitAddon.fit();
        window.term = term;
        term.focus();
        
        // Command history
        let commandHistory = [];
        let historyIndex = -1;
        
        // Current input line
        let currentInput = '';
        
        // Add event listener for keyboard input
        term.onData((data) => {
            switch (data) {
                case '\r': // Enter key
                    if (currentInput.trim() !== '') {
                        commandHistory.push(currentInput);
                        historyIndex = commandHistory.length;
                        term.write('\n');
                        executeCommand(currentInput.trim());
                    } else {
                        term.write('\r\n$ ');
                    }
                    currentInput = '';
                    break;
                case '\u007F': // Backspace key
                    if (currentInput.length > 0) {
                        currentInput = currentInput.slice(0, -1);
                        term.write('\b \b');
                    }
                    break;
                default:
                    // Printable characters
                    if (data >= ' ' && data <= '~') {
                        currentInput += data;
                        term.write(data);
                    }
                    break;
            }
        });
        
        // Handle arrow keys for command history and Ctrl+D
        term.onKey((key) => {
            if (key.key === '\u001B[A') { // Up arrow
                if (commandHistory.length > 0) {
                    if (historyIndex === commandHistory.length) {
                        // Save current input
                        commandHistory.push(currentInput);
                    }
                    historyIndex = Math.max(0, historyIndex - 1);
                    const prevCommand = commandHistory[historyIndex];
                    // Clear current line
                    term.write('\r$ ' + ' '.repeat(currentInput.length));
                    // Move cursor back to start of input
                    term.write('\r$ ');
                    currentInput = prevCommand;
                    term.write(prevCommand);
                }
            } else if (key.key === '\u001B[B') { // Down arrow
                if (commandHistory.length > 0) {
                    historyIndex = Math.min(commandHistory.length, historyIndex + 1);
                    const nextCommand = commandHistory[historyIndex] || '';
                    // Clear current line
                    term.write('\r$ ' + ' '.repeat(currentInput.length));
                    // Move cursor back to start of input
                    term.write('\r$ ');
                    currentInput = nextCommand;
                    term.write(nextCommand);
                }
            } else if (key.key === 'd' && key.ctrlKey) { // Ctrl+D
                exit();
            }
        });
        
function executeCommand(command) {
            const parts = command.split(' ');
            const cmd = parts[0].toLowerCase();
            const args = parts.slice(1);
            
            switch (cmd) {
                case 'dig':
                    dig(args);
                    break;
                case 'ping':
                    ping(args);
                    break;
                case 'clear':
                    clear();
                    break;
                case 'help':
                    help();
                    break;
                case 'exit':
                    exit();
                    break;
                case '':
                    // Empty command, do nothing
                    term.write('\r$ ');
                    break;
                default:
                    term.write('\r\nCommand not found: ' + cmd + '\r\n\r$ ');
                    break;
            }
        }
        
function dig(args) {
            if (args.length === 0) {
                term.write('\r\ndig: missing host\r\n\r$ ');
                return;
            }
            
            const host = args[0];
            term.write('\r\ndigging ' + host + '...\r\n');
            
            // Use Google DNS over HTTPS (CORS-friendly)
            fetch('https://dns.google/resolve?name=' + encodeURIComponent(host))
                .then(response => {
                    if (!response.ok) throw new Error('DNS query failed');
                    return response.json();
                })
                .then(data => {
                    if (data.Answer && data.Answer.length > 0) {
                        const answer = data.Answer.find(a => a.type === 1); // A record
                        if (answer) {
                            term.write(';; Got answer:\r\n');
                            term.write(';; ->>HEADER<<- opcode: QUERY, status: NOERROR, id: ' + Math.floor(Math.random() * 10000) + '\r\n');
                            term.write(';; flags: qr rd ra; QUERY: 1, ANSWER: 1, AUTHORITY: 0, ADDITIONAL: 1\r\n');
                            term.write('\r\n');
                            term.write(';; OPT PSEUDOSECTION:\r\n');
                            term.write('; EDNS: version 0; flags: ; udp: 512\r\n');
                            term.write('\r\n');
                            term.write(';; ANSWER SECTION:\r\n');
                            term.write(host + '.\t3600\tIN\tA\t' + answer.data + '\r\n');
                            term.write('\r\n');
                            term.write(';; Query time: 45 msec\r\n');
                            term.write(';; SERVER: 8.8.8.8#53(8.8.8.8)\r\n');
                            const now = new Date();
                            term.write(';; WHEN: ' + now.toUTCString() + '\r\n');
                            term.write(';; MSG SIZE  rcvd: 45\r\n');
                            term.write('\r$ ');
} else {
                        term.write(';; NO A RECORD FOUND FOR ' + host + '\r\n\r$ ');
                    }
                } else {
                    term.write(';; FAILED TO RESOLVE ' + host + '\r\n\r$ ');
                }
            })
            .catch(err => {
                    term.write('\r\ndig: failed to resolve ' + host + ': ' + err.message + '\r\n\r$ ');
                });
        }
        
        function ping(args) {
            if (args.length === 0) {
                term.write('\r\nping: missing hostname\r\n\r$ ');
                return;
            }
            
            const host = args[0];
            term.write('\r\nPING ' + host + ' (' + host + ') 56(84) bytes of data.\r\n');
            
            // Check connectivity using fetch (works for HTTP/HTTPS hosts)
            const startTime = Date.now();
            
            fetch('https://' + host, { method: 'HEAD', mode: 'no-cors', timeout: 3000 })
                .then(() => {
                    const endTime = Date.now();
                    const rtt = endTime - startTime;
                    
                    // Show ping responses
                    for (let i = 0; i < 4; i++) {
                        setTimeout(() => {
                            term.write('64 bytes from ' + host + ': icmp_seq=' + (i+1) + ' ttl=64 time=' + rtt + ' ms\r\n');
                        }, i * 50);
                    }
                    
                    // Show summary after all responses
                    setTimeout(() => {
                        term.write('\r\n--- ' + host + ' ping statistics ---\r\n');
                        term.write('4 packets transmitted, 4 received, 0% packet loss, time ' + (rtt * 4) + 'ms\r\n');
                        term.write('rtt min/avg/max/mdev = ' + rtt + '/' + rtt + '/' + rtt + '/0.000 ms\r\n');
                        term.write('\r$ ');
                    }, 250);
                })
                .catch(err => {
                    // Show failure responses
                    for (let i = 0; i < 4; i++) {
                        setTimeout(() => {
                            term.write('Request failed: host unreachable\r\n');
                        }, i * 50);
                    }
                    
                    setTimeout(() => {
                        term.write('\r\n--- ' + host + ' ping statistics ---\r\n');
                        term.write('4 packets transmitted, 0 received, 100% packet loss, time ' + (Date.now() - startTime) + 'ms\r\n');
                        term.write('\r$ ');
                    }, 250);
});
        }
        
        function help() {
            term.write('\r\nAvailable commands:\r\n');
            term.write('  dig <host>       - Look up DNS information for a host\r\n');
            term.write('  ping <host>      - Test network connectivity to a host\r\n');
            term.write('  clear            - Clear the terminal screen\r\n');
            term.write('  help             - Show this help message\r\n');
            term.write('  exit             - Close this tab/window\r\n');
            term.write('\r$ ');
        }
        
        function exit() {
            window.close();
        }
        
        function clear() {
            term.clear();
            term.write('\r$ ');
        }
        
        // Show banner on load
        const now = new Date();
        const pacificTime = now.toLocaleTimeString('en-US', { timeZone: 'America/Los_Angeles' });
        term.write('\r\n');
        term.write('  Welcome to maroku.sh - Pacific Time: ' + pacificTime + '\r\n\r\n');
        term.write('  Type help to see available commands.\r\n\r\n$ ');
    </script>
  </body>
</html>
